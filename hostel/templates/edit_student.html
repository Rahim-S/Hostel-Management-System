<div class="modal fade" id="editStudentModal{{ student.pk }}" tabindex="-1" aria-labelledby="editStudentModalLabel{{ student.pk }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="{% url 'edit_student_page' student.pk %}">
        {% csrf_token %}
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="editStudentModalLabel{{ student.pk }}">Edit {{ student.first_name }} {{ student.last_name }}</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          {{ student_form.as_p }}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>
    </div>
  </div>
</div>

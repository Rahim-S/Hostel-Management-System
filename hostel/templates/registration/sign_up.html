{% load static %}
{% load crispy_forms_tags %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Hostel Management System</title>
  <link rel="shortcut icon" href="{% static 'images/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'vendors/feather/feather.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/ti-icons/css/themify-icons.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/font-awesome/css/font-awesome.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/typicons/typicons.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/simple-line-icons/css/simple-line-icons.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/css/vendor.bundle.base.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-content" aria-labelledby="signup-title">
      <div class="auth-card">
        <a class="auth-brand" href="{% url 'index_page' %}">Hostel Management System</a>
        <h1 class="auth-title" id="signup-title">Create your account</h1>
        {% if message %}
          <div class="auth-alert auth-alert-info" role="status">{{ message }}</div>
        {% endif %}
        <form method="post" class="auth-form">
          {% csrf_token %}
          {{ sign_up_form|crispy }}
          <button type="submit" class="auth-submit">
            <span>Create account</span>
            <span aria-hidden="true">&rarr;</span>
          </button>
        </form>
        <p class="auth-switch">
          Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </p>
      </div>
    </section>
  </main>
  <script src="{% static 'vendors/js/vendor.bundle.base.js' %}"></script>
</body>
</html>

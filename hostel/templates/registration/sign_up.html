{% load static %}
{% load crispy_forms_tags %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hostel Management System</title>
  <link rel="shortcut icon" href="{% static 'images/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'vendors/feather/feather.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/ti-icons/css/themify-icons.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/font-awesome/css/font-awesome.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/typicons/typicons.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/simple-line-icons/css/simple-line-icons.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/css/vendor.bundle.base.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <main class="content-wrapper d-flex align-items-center auth px-0">
        <div class="row w-100 mx-0">
          <div class="col-lg-5 col-md-8 mx-auto">
            <section class="auth-form-light text-left py-5 px-4 px-sm-5">
              <div class="brand-logo">
                <a href="{% url 'index_page' %}" class="text-primary text-decoration-none fw-bold fs-5">
                  Hostel Management System
                </a>
              </div>
              <h4>Create your account</h4>
              <h6 class="fw-light">Register to access the hostel management system.</h6>
              {% if message %}
                <div class="alert alert-info" role="status">{{ message }}</div>
              {% endif %}
              <form method="post" class="pt-3">
                {% csrf_token %}
                {{ sign_up_form|crispy }}
                <div class="mt-3 d-grid gap-2">
                  <button type="submit" class="btn btn-primary btn-lg fw-medium">Sign up</button>
                </div>
                <div class="text-center mt-4 fw-light">
                  Already have an account? <a href="{% url 'login' %}" class="text-primary">Log in</a>
                </div>
              </form>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="{% static 'vendors/js/vendor.bundle.base.js' %}"></script>
  <script src="{% static 'js/off-canvas.js' %}"></script>
  <script src="{% static 'js/hoverable-collapse.js' %}"></script>
  <script src="{% static 'js/template.js' %}"></script>
</body>
</html>
